<div class="m3-segmented-container" role="radiogroup" aria-label="Selectable options">
  @for (option of options(); track option) {
    <button
      type="button"
      class="segment-pill"
      [class.selected]="option === selected()"
      (click)="select(option)"
      role="radio"
      [attr.aria-checked]="option === selected()"
    >
      @if (option === selected()) {
        <span class="material-symbols-outlined check-icon">check</span>
      }
      <span>{{ option }}</span>
    </button>
  }
</div>
